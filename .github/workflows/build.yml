name: Build Qalam IDE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows standalone installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa-LSP
          ref: 162ef31afd6decf1fdce23f3352d948ca2240122
          path: ecosystem/Baa-LSP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Bootstrap, build, test, and package standalone Qalam
        shell: pwsh
        run: .\scripts\bootstrap-windows.ps1 -SkipWinget -BuildTests -SkipCompiler -BaaLspSourceDir ecosystem/Baa-LSP
      - name: Build standalone installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version 3.3.0 -BuildDir build/windows-release -BaaLspExecutable ecosystem/Baa-LSP/build/windows-release/baa-lsp.exe -SkipBuild
      - name: Verify install, launch, and uninstall
        shell: powershell
        run: .\scripts\test_installer.ps1 -Version 3.3.0
      - uses: actions/upload-artifact@v4
        with:
          name: qalam-setup-3.3.0-x64
          path: |
            dist/Qalam-win64.zip
            dist/installer/qalam-setup-3.3.0-x64.exe
            dist/installer/qalam-setup-3.3.0-x64.exe.sha256

  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa-LSP
          ref: 162ef31afd6decf1fdce23f3352d948ca2240122
          path: ecosystem/Baa-LSP
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa
          ref: ccf37c534f88a83598536c483f7c8afbbdd6f073
          path: ecosystem/Baa
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: f7fcf8f6d2bf629daf708b3b6028e22c74683ce6
          path: ecosystem/Nazm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \
            libxcb-cursor-dev libxcb-xinerama0 libxcb-xinerama0-dev
      - name: Build
        run: |
          cmake -S . -B build/linux-release -DCMAKE_BUILD_TYPE=Release -DQALAM_BUILD_TESTS=ON
          cmake --build build/linux-release --parallel
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/linux-release --output-on-failure
          cmake -S ecosystem/Baa-LSP -B ecosystem/Baa-LSP/build \
            -DCMAKE_BUILD_TYPE=Release -DBAA_LSP_BUILD_TESTS=OFF
          cmake --build ecosystem/Baa-LSP/build --parallel
          cmake -S ecosystem/Baa -B ecosystem/Baa/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ecosystem/Baa/build --parallel --target baa baa_runtime
          cmake -S ecosystem/Nazm -B ecosystem/Nazm/build \
            -DCMAKE_BUILD_TYPE=Release -DNAZM_BUILD_TESTS=OFF
          cmake --build ecosystem/Nazm/build --parallel --target nazm
      - name: Package Qalam developer archive with Baa-LSP, Baa, and Nazm
        run: |
          cmake --install build/linux-release --prefix dist/Qalam-linux-x86_64
          mkdir -p dist/Qalam-linux-x86_64/baa-lsp
          cp ecosystem/Baa-LSP/build/baa-lsp dist/Qalam-linux-x86_64/baa-lsp/baa-lsp
          mkdir -p dist/Qalam-linux-x86_64/baa/stdlib
          cp ecosystem/Baa/build/baa dist/Qalam-linux-x86_64/baa/baa
          cp ecosystem/Baa/build/libbaa_runtime.a dist/Qalam-linux-x86_64/baa/libbaa_runtime.a
          cp -R ecosystem/Baa/stdlib/. dist/Qalam-linux-x86_64/baa/stdlib/
          cp ecosystem/Nazm/build/نظم dist/Qalam-linux-x86_64/baa/نظم
          chmod +x dist/Qalam-linux-x86_64/baa/baa dist/Qalam-linux-x86_64/baa/نظم
          dist/Qalam-linux-x86_64/baa-lsp/baa-lsp --version
          dist/Qalam-linux-x86_64/baa/baa --version
          dist/Qalam-linux-x86_64/baa/نظم --إصدار
          mkdir -p dist/اختبار-حزمة
          printf 'صحيح الرئيسية() {\n    إرجع ٠.\n}\n' > dist/اختبار-حزمة/رئيسي.baa
          BAA_HOME="$PWD/dist/Qalam-linux-x86_64/baa" \
          BAA_NAZM="$PWD/dist/Qalam-linux-x86_64/baa/نظم" \
            dist/Qalam-linux-x86_64/baa/baa -c \
              dist/اختبار-حزمة/رئيسي.baa -o dist/اختبار-حزمة/رئيسي.o
          test -s dist/اختبار-حزمة/رئيسي.o
          rm -rf dist/اختبار-حزمة
          tar -C dist -czf dist/Qalam-linux-x86_64.tar.gz Qalam-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Qalam-linux-x86_64
          path: dist/Qalam-linux-x86_64.tar.gz
